<!doctype html>
<html lang="{{ page.lang | default: 'en' }}" data-theme="{% if page.personal %}light{% else %}dark{% endif %}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | escape }} — Giao Ky DUONG</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}">
    <link rel="alternate" type="application/rss+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
    <script src="{{ '/assets/site.js' | relative_url }}" defer></script>
  </head>
  <body class="{{ page.body_class }}{% if page.personal %} concept{% endif %}">
    <a class="skip-link" href="#main-content">{% if page.lang == 'vi' %}Đến nội dung{% else %}Skip to content{% endif %}</a>
    {% include academic-header.html %}
    <main id="main-content" tabindex="-1">{{ content }}</main>
    {% if page.personal %}
      {% include personal-links.html %}
    {% else %}
      <footer><div class="shell"><span>© {{ site.time | date: '%Y' }} Giao Ky DUONG</span><a href="mailto:{{ site.author.email }}">Contact</a></div></footer>
    {% endif %}
  </body>
</html>
